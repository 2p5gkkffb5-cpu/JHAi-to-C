[project]
name = "jhai-to-c-api"
version = "0.1.0"
description = "JHAi-to-C AI content production API."
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.18.5",
  "fastapi==0.139.0",
  "greenlet==3.5.4",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
